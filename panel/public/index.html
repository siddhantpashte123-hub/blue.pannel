<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070f1f" />
<title>BLUENODES — Minecraft Hosting Panel</title>
<meta name="description" content="BLUENODES — a fast, self-hosted Minecraft hosting panel. Made by blue." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1a33'/%3E%3Cpath d='M32 10 52 21v22L32 54 12 43V21z' fill='%232f80ff'/%3E%3Cpath d='M32 10 52 21 32 32 12 21z' fill='%2360a5fa'/%3E%3Cpath d='M32 32v22L12 43V21z' fill='%231d4ed8'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M32 6 56 19v26L32 58 8 45V19z" fill="url(#bg1)"/><path d="M32 6 56 19 32 32 8 19z" fill="url(#bg2)"/><path d="M32 32v26L8 45V19z" fill="url(#bg3)"/><defs><linearGradient id="bg1" x1="8" y1="6" x2="56" y2="58"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="bg2" x1="8" y1="6" x2="32" y2="32"><stop stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="bg3" x1="8" y1="32" x2="56" y2="58"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">BLUE<span>NODES</span></span>
        <span class="brand-sub">made by blue</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" data-route="#/dashboard"><span class="nav-ico" data-icon="grid"></span><span>Dashboard</span></a>
      <a class="nav-item" data-route="#/servers"><span class="nav-ico" data-icon="server"></span><span>Servers</span><em class="nav-badge" id="navServerCount">0</em></a>
      <a class="nav-item" data-route="#/create"><span class="nav-ico" data-icon="plus"></span><span>Create server</span></a>
      <a class="nav-item" data-route="#/system"><span class="nav-ico" data-icon="cpu"></span><span>System</span></a>
      <a class="nav-item" data-route="#/about"><span class="nav-ico" data-icon="info"></span><span>About</span></a>
    </nav>

    <div class="sidebar-card" id="javaCard">
      <div class="sidebar-card-title">Java runtime</div>
      <div class="sidebar-card-value" id="javaSideValue">checking...</div>
      <button class="btn btn-ghost btn-sm" data-action="java-help">Setup java</button>
    </div>

    <div class="sidebar-footer">
      <div class="dot-live" id="liveDot"></div>
      <span id="liveLabel">connecting...</span>
      <span class="ver">v<span class="js-version">1.0.0</span></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="toggle-sidebar" aria-label="Menu">
        <span data-icon="menu"></span>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Minecraft hosting, one command away.</p>
      </div>
      <div class="topbar-actions">
        <div class="sys-pills" id="sysPills"></div>
        <button class="icon-btn" data-action="refresh" title="Refresh">
          <span data-icon="refresh"></span>
        </button>
        <a class="btn btn-primary" href="#/create"><span data-icon="plus"></span><span class="hide-sm">New server</span></a>
      </div>
    </header>

    <div class="view" id="view">
      <div class="skeleton-wrap">
        <div class="skeleton h-xl"></div>
        <div class="skeleton-grid">
          <div class="skeleton h-lg"></div>
          <div class="skeleton h-lg"></div>
          <div class="skeleton h-lg"></div>
          <div class="skeleton h-lg"></div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span>BLUENODES <b>v<span class="js-version">1.0.0</span></b> — made with 💙 by <b>blue</b></span>
      <span class="footer-links">
        <a href="#/about">About</a>
        <span>·</span>
        <a href="https://github.com/siddhantpashte123-hub/blue.pannel" target="_blank" rel="noreferrer">GitHub</a>
        <span>·</span>
        <span>port <b id="footerPort">6868</b></span>
      </span>
    </footer>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/actions.js"></script>
</body>
</html>
